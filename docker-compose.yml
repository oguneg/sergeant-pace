# Production: docker compose up -d --build
# Needs .env with GEMINI_API_KEY and DOMAIN=your.domain (see .env.example).
# HTTPS is handled by the server's shared Caddy proxy (~/proxy on the VPS): this service joins the
# external "web" network and declares its domain with labels. Do not publish ports here.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SP_TRUST_PROXY: "1"   # the real client IP comes from Caddy's X-Forwarded-For; only Caddy can reach this container
      # Site-wide daily caps and a per-visitor daily allowance. On a free Gemini key the real limit is Google's quota, not these numbers:
      # when Gemini is struggling the app says so up front instead of letting visitors fill in a form first.
      SP_DAILY_COACH: "${SP_DAILY_COACH:-200}"
      SP_DAILY_SPEAK: "${SP_DAILY_SPEAK:-120}"
      SP_DAILY_TRANSCRIBE: "${SP_DAILY_TRANSCRIBE:-60}"
      SP_RATE_COACH: "${SP_RATE_COACH:-20}"
      SP_IP_DAILY_COACH: "${SP_IP_DAILY_COACH:-30}"       # per visitor per day, so one person cannot drain the shared budget
      SP_IP_DAILY_SPEAK: "${SP_IP_DAILY_SPEAK:-40}"
      SP_IP_DAILY_TRANSCRIBE: "${SP_IP_DAILY_TRANSCRIBE:-10}"
      SP_GEMINI_PAID: "${SP_GEMINI_PAID:-0}"   # the privacy notice describes Google's free or paid terms; only set 1 for a paid key
    logging:               # logs hold visitors' IP addresses, so they are rotated by size and never pile up
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m          # a runaway here must not take the other projects on this server down with it
    volumes:
      - pace-data:/data
    networks:
      - web
      - default
    labels:
      caddy: ${DOMAIN:?Set DOMAIN in .env}
      caddy.reverse_proxy: "{{upstreams 8000}}"
      caddy.encode: zstd gzip

networks:
  web:
    external: true

volumes:
  pace-data:
